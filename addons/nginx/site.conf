server {

    listen 80;
    server_name vpn.example.com;

    root /var/www/vpn;
    index index.php;

    access_log /var/log/nginx/vpn-access.log;
    error_log  /var/log/nginx/vpn-error.log;

    autoindex off;

    # ВАЖНО: регексп-локации проверяются в порядке объявления.
    # Защищённые PHP-локации должны быть объявлены ДО общего location ~ \.php$,
    # иначе скрипты в /admin и /ccd исполняются без авторизации
    # (регексп \.php$ перебивает префиксные location /admin, /ccd).
    location ~ ^/admin/.+\.php$ {
        auth_basic "VPN Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ ^/ccd/.+\.php$ {
        auth_basic "VPN User";
        auth_basic_user_file /etc/nginx/.htpasswd-ccd;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # PHP вне защищённых зон (главная страница)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # admin auth (не-PHP файлы в /admin)
    location /admin {
        auth_basic "VPN Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;
        try_files $uri $uri/ /index.php?$args;
    }

    # ccd auth (не-PHP файлы в /ccd)
    location /ccd {
        auth_basic "VPN User";
        auth_basic_user_file /etc/nginx/.htpasswd-ccd;
        try_files $uri $uri/ /index.php?$args;
    }
}
